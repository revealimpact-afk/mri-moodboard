<style>
:root {
  --surface: #FDFCFA;

  --ink: #2B2926;

  --shadow: rgba(43,41,38,0.06);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1A1917;
    --surface-card: #262421;
    --surface-hover: #302D2A;
    --ink: #E8E5E0;
    --ink-soft: #C4C0BA;
    --muted: #8C8880;
    --accent: #7FA08E;
    --accent-soft: #2D3832;
    --accent-text: #9ABFAB;
    --gold: #C4A475;
    --gold-soft: #3A3228;
    --border: #3A3734;
    --shadow: rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"] {
  --surface: #1A1917;
  --surface-card: #262421;
  --surface-hover: #302D2A;
  --ink: #E8E5E0;
  --ink-soft: #C4C0BA;
  --muted: #8C8880;
  --accent: #7FA08E;
  --accent-soft: #2D3832;
  --accent-text: #9ABFAB;
  --gold: #C4A475;
  --gold-soft: #3A3228;
  --border: #3A3734;
  --shadow: rgba(0,0,0,0.2);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 0;
}
.app-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-title span { color: var(--accent); font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500; }
.cahiers-links {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.cahiers-link {
  display: flex;

  gap: 6px;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--gold);
  background: var(--gold-soft);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
}
.cahiers-link:hover { background: var(--gold); color: var(--surface); }
.cahiers-link svg { width: 14px; height: 14px; flex-shrink: 0; }
.search-wrap {
  position: relative;
  margin-bottom: 10px;
}
.search-wrap svg {

  top: 50%;

  width: 16px;
  height: 16px;
}
.search-input {
  width: 100%;
  padding: 8px 12px 8px 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-card);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--accent); }
.cat-pills {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.cat-pills::-webkit-scrollbar { display: none; }
.cat-pill {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.cat-pill:hover { border-color: var(--accent); color: var(--accent-text); }
.cat-pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.content { padding: 12px 16px 80px; }
.cat-section { margin-bottom: 24px; }
.cat-section.hidden { display: none; }
.cat-header {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 10px;

}
.cat-badge {

  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--gold-soft);
  color: var(--gold);
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--accent); }
.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.card-header:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.card-chevron {
  width: 16px;
  height: 16px;
  color: var(--muted);
  transition: transform 0.25s;
  flex-shrink: 0;
}
.card.open .card-chevron { transform: rotate(90deg); }
.card-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
  flex: 1;
}
.card-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent-text);
  flex-shrink: 0;
}
.card-body {
  display: none;
  padding: 0 14px 14px;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.6;
}
.card.open .card-body { display: block; }
.card-body h4 {
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-text);
  margin: 12px 0 6px;
}
.card-body h4:first-child { margin-top: 4px; }
.card-body p { margin-bottom: 8px; }
.card-body ul, .card-body ol { padding-left: 18px; margin-bottom: 8px; }
.card-body li { margin-bottom: 3px; }
.card-body strong { color: var(--ink); font-weight: 600; }
.memo-table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.memo-table-wrap { overflow-x: auto; }
.memo-table th {
  text-align: left;
  padding: 6px 8px;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.memo-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.memo-table tr:last-child td { border-bottom: none; }
.alert-box {
  background: var(--gold-soft);
  border-left: 3px solid var(--gold);
  padding: 8px 10px;
  border-radius: 0 6px 6px 0;
  margin: 8px 0;
  font-size: 12px;
  color: var(--ink-soft);
}
.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
  display: none;
}
.stats-bar {
  display: flex;
  gap: 12px;
  padding: 8px 16px;
  font-size: 11px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  background: var(--surface-card);
}
.stats-bar strong { color: var(--accent-text); font-weight: 600; }

/* Moodboard Builder */
.mb-section { display: none; padding: 12px 16px 80px; }
.mb-section.visible { display: block; }
.mb-form { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.mb-form label { display: block; font-weight: 600; font-size: 12px; color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; margin-top: 12px; }
.mb-form label:first-child { margin-top: 0; }
.mb-form select, .mb-form input[type="text"], .mb-form input[type="date"] {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--ink); font-family: inherit; font-size: 13px; outline: none;
}
.mb-form select:focus, .mb-form input:focus { border-color: var(--accent); }
.mb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mb-extras { margin-top: 12px; }
.mb-extras summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.04em; }
.mb-extras-body { padding-top: 8px; }
.mb-chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.mb-chip { padding: 4px 10px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
  font-size: 12px; cursor: pointer; color: var(--ink-soft); transition: all 0.2s; }
.mb-chip:hover { border-color: var(--accent); }
.mb-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.mb-generate {
  display: block; width: 100%; margin-top: 16px; padding: 12px;
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  font-family: 'Playfair Display', Georgia, serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity 0.2s; letter-spacing: 0.02em;
}
.mb-generate:hover { opacity: 0.9; }
.mb-output { display: none; }
.mb-output.visible { display: block; }
.mb-board {
  background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 16px;
}
.mb-board-header {
  padding: 24px 20px 16px; text-align: center;
  border-bottom: 1px solid var(--border);
}
.mb-board-header h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.mb-board-header p { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.mb-board-header .mb-theme-label { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 16px; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 600; }
.mb-palette-row { display: flex; height: 80px; }
.mb-palette-swatch { flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
.mb-palette-swatch span { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; padding: 2px 5px; border-radius: 3px; }
.mb-board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
.mb-board-cell { background: var(--surface-card); padding: 16px; }
.mb-board-cell h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.mb-board-cell ul { list-style: none; padding: 0; }
.mb-board-cell li { font-size: 12px; color: var(--ink-soft); padding: 3px 0; padding-left: 14px; position: relative; }
.mb-board-cell li::before { content: ''; position: absolute; left: 0; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.mb-texture-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mb-texture-chip { height: 48px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 9px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); letter-spacing: 0.04em; }
.mb-mood-quote { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 15px; color: var(--ink); text-align: center; padding: 20px; line-height: 1.6; }
.mb-board-footer { text-align: center; padding: 12px; font-size: 10px; color: var(--muted); border-top: 1px solid var(--border); letter-spacing: 0.06em; text-transform: uppercase; }
.mb-ai-section { padding: 16px; border-top: 1px solid var(--border); }
.mb-ai-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--gold)); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.2s; }
.mb-ai-btn:hover { opacity: 0.9; }
.mb-ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.mb-ai-loading { text-align: center; padding: 24px 0; color: var(--muted); font-size: 12px; }
.mb-ai-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: mbspin 1s linear infinite; margin: 0 auto 8px; }
@keyframes mbspin { to { transform: rotate(360deg); } }
.mb-ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.mb-ai-card { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-card); }
.mb-ai-card.wide { grid-column: 1 / -1; }
.mb-ai-card img { width: 100%; display: block; object-fit: cover; }
.mb-ai-card .caption { padding: 6px 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); text-align: center; }
.mb-rule-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.mb-rule-block { flex: 1; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.mb-elements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mb-el-tag { padding: 5px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); font-size: 11px; color: var(--ink-soft); text-align: center; }

@media (min-width: 640px) {
  .content { max-width: 680px; margin: 0 auto; padding: 20px 24px 80px; }
  .mb-section { max-width: 680px; margin: 0 auto; padding: 20px 24px 80px; }
  .app-header { padding: 16px 24px 0; }
  .app-header > * { max-width: 680px; margin-left: auto; margin-right: auto; }
  .stats-bar { justify-content: center; }
}
</style>

<script>
const DATA = [
  {
    cat: "Arts de la table",
    icon: "1",
    cards: [
      {
        title: "Placement des couverts — règle générale",
        tag: "Essentiel",
        body: `<h4>Principe de base</h4>
<p>Les couverts se placent <strong>dans l'ordre d'utilisation, de l'extérieur vers l'assiette</strong>. On commence par les couverts du premier plat (les plus éloignés) et on avance vers l'assiette au fil des plats.</p>
<h4>Côté gauche (fourchettes)</h4>
<ul>
<li><strong>Fourchette à poisson / entrée</strong> — la plus à l'extérieur</li>
<li><strong>Fourchette à viande / plat</strong> — la plus proche de l'assiette</li>
<li>Dents vers le haut (style français) ou vers le bas (style anglais)</li>
</ul>
<h4>Côté droit (couteaux et cuillères)</h4>
<ul>
<li><strong>Cuillère à soupe</strong> — la plus à l'extérieur (si potage prévu)</li>
<li><strong>Couteau à poisson / entrée</strong> — au milieu</li>
<li><strong>Couteau à viande / plat</strong> — le plus proche de l'assiette, <strong>lame vers l'assiette</strong></li>
</ul>
<h4>Au-dessus de l'assiette (couverts à dessert)</h4>
<ul>
<li><strong>Cuillère à dessert</strong> — manche vers la droite</li>
<li><strong>Fourchette à dessert</strong> — manche vers la gauche (en dessous de la cuillère)</li>
<li>Parfois remplacés par un couteau à fromage</li>
</ul>
<div class="alert-box"><strong>Astuce examen :</strong> « Les fourchettes à gauche comme Fourchette commence par F comme gauche (Fourche → Fork → côté du cœur). Les couteaux à droite, lame tournée vers l'assiette par politesse. »</div>`
      },
      {
        title: "Placement des verres",
        tag: "Essentiel",
        body: `<h4>Disposition</h4>
<p>Les verres se placent <strong>en diagonale ou en triangle</strong> au-dessus des couteaux (côté droit), du plus grand au plus petit, de gauche à droite :</p>
<div class="memo-table-wrap"><table class="memo-table">
<tr><th>Position</th><th>Verre</th><th>Taille</th></tr>
<tr><td>1 (gauche, le + grand)</td><td><strong>Verre à eau</strong></td><td>Le plus grand</td></tr>
<tr><td>2 (milieu)</td><td><strong>Verre à vin rouge</strong></td><td>Moyen</td></tr>
<tr><td>3 (droite, le + petit)</td><td><strong>Verre à vin blanc</strong></td><td>Le plus petit</td></tr>
</table></div>
<h4>Variantes</h4>
<ul>
<li><strong>Flûte à champagne</strong> : en retrait, derrière les 3 verres principaux</li>
<li><strong>Mariage haut de gamme</strong> : possibilité d'ajouter un verre à digestif</li>

</ul>
<div class="alert-box"><strong>Mnémotechnique :</strong> « Du plus grand au plus petit = E.R.B. = Eau, Rouge, Blanc » — dans l'ordre de gauche à droite.</div>`

        tag: "Checklist",
        body: `<h4>Éléments par couvert</h4>
<ol>
<li><strong>Assiette de présentation</strong> (sous-assiette) — reste en place pendant tout le repas</li>
<li><strong>Assiette à pain</strong> — en haut à gauche, avec couteau à beurre posé dessus</li>

<li><strong>Verres</strong> — en diagonale au-dessus des couteaux</li>

</ol>

function renderApp() {
  const pillsEl = document.getElementById('catPills');
  const contentEl = document.getElementById('content');
  const statsEl = document.getElementById('statsBar');

  let totalCards = 0;
  DATA.forEach(c => totalCards += c.cards.length);

  pillsEl.innerHTML = '<button class="cat-pill active" data-cat="all">Toutes</button>' +
    '<button class="cat-pill" data-cat="moodboard" style="background:var(--gold-soft);color:var(--gold);border-color:var(--gold);font-weight:700;">Moodboard</button>' +
    DATA.map(c => '<button class="cat-pill" data-cat="' + c.cat + '">' + c.cat + '</button>').join('');

  statsEl.innerHTML = '<strong>' + totalCards + '</strong> fiches &middot; <strong>' + DATA.length + '</strong> rubriques';

  contentEl.innerHTML = DATA.map(c => `
    <section class="cat-section" data-cat="${c.cat}">
      <div class="cat-header"><span class="cat-badge">${c.icon}</span>${c.cat}</div>
      ${c.cards.map((card, i) => `
        <div class="card" data-search="${(card.title + ' ' + card.body).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')}">
          <div class="card-header" tabindex="0" role="button" aria-expanded="false" onclick="toggleCard(this)">
            <svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            <span class="card-title">${card.title}</span>
            <span class="card-tag">${card.tag}</span>
          </div>
          <div class="card-body">${card.body}</div>
        </div>
      `).join('')}
    </section>
  `).join('');

  pillsEl.addEventListener('click', e => {
    if (!e.target.classList.contains('cat-pill')) return;
    pillsEl.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    e.target.classList.add('active');
    const cat = e.target.dataset.cat;
    document.querySelectorAll('.cat-section').forEach(s => {
      s.classList.toggle('hidden', cat !== 'all' && s.dataset.cat !== cat);
    });
    document.getElementById('searchInput').value = '';
    document.getElementById('noResults').style.display = 'none';
  });
}

function toggleCard(header) {
  const card = header.parentElement;
  const wasOpen = card.classList.contains('open');
  card.classList.toggle('open');
  header.setAttribute('aria-expanded', !wasOpen);
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pills = document.querySelectorAll('.cat-pill');
  pills.forEach(p => p.classList.remove('active'));
  pills[0].classList.add('active');

  let visible = 0;
  document.querySelectorAll('.cat-section').forEach(s => {
    s.classList.remove('hidden');
    let sectionVisible = 0;
    s.querySelectorAll('.card').forEach(c => {
      const match = !q || c.dataset.search.includes(q);
      c.style.display = match ? '' : 'none';
      if (match) sectionVisible++;
    });
    if (!sectionVisible) s.classList.add('hidden');
    visible += sectionVisible;
  });
  document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card-header')) {
    toggleCard(e.target);
  }
});

renderApp();

const MOODS = ["Intimiste","Festif","Solennel","Décontracté","Luxueux","Poétique","Joyeux","Mystérieux"];
const SEASONS = ["Printemps","Été","Automne","Hiver","Toutes saisons"];

function initMoodboard() {
  const sel = document.getElementById('mbTheme');
  sel.innerHTML = Object.keys(THEMES).map(t => '<option value="'+t+'">'+t+'</option>').join('');

  const moodChips = document.getElementById('mbMoodChips');
  moodChips.innerHTML = MOODS.map(m => '<span class="mb-chip" data-val="'+m+'">'+m+'</span>').join('');
  moodChips.addEventListener('click', e => { if(e.target.classList.contains('mb-chip')) e.target.classList.toggle('selected'); });

  const seasonChips = document.getElementById('mbSeasonChips');
  seasonChips.innerHTML = SEASONS.map(s => '<span class="mb-chip" data-val="'+s+'">'+s+'</span>').join('');
  seasonChips.addEventListener('click', e => {
    if(!e.target.classList.contains('mb-chip')) return;
    seasonChips.querySelectorAll('.mb-chip').forEach(c => c.classList.remove('selected'));
    e.target.classList.toggle('selected');
  });

  document.getElementById('mbGenerate').addEventListener('click', generateMoodboard);
}

function generateMoodboard() {
  const theme = document.getElementById('mbTheme').value;
  const t = THEMES[theme];
  const bride = document.getElementById('mbBride').value || 'Elle';
  const groom = document.getElementById('mbGroom').value || 'Lui';
  const dateVal = document.getElementById('mbDate').value;
  const dateStr = dateVal ? new Date(dateVal).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}) : '';

  const selectedMoods = [...document.querySelectorAll('#mbMoodChips .mb-chip.selected')].map(c => c.dataset.val);
  const selectedSeason = document.querySelector('#mbSeasonChips .mb-chip.selected');

  const out = document.getElementById('mbOutput');
  out.classList.add('visible');

  const moodLine = selectedMoods.length ? '<p style="margin-top:8px;font-size:11px;color:var(--muted);">Ambiances : <strong>'+selectedMoods.join(', ')+'</strong></p>' : '';
  const seasonLine = selectedSeason ? '<p style="font-size:11px;color:var(--muted);">Saison florale : <strong>'+selectedSeason.dataset.val+'</strong></p>' : '';

  out.innerHTML = `
    <div class="mb-board">
      <div class="mb-board-header">
        <h2>${bride} & ${groom}</h2>
        ${dateStr ? '<p>'+dateStr+'</p>' : ''}
        <span class="mb-theme-label">${theme}</span>
        ${moodLine}${seasonLine}
      </div>

      <div class="mb-palette-row">
        ${t.palette.map(c => {
          const dark = isDark(c.hex);
          return '<div class="mb-palette-swatch" style="background:'+c.hex+'"><span style="color:'+(dark?'#fff':'#333')+';background:'+(dark?'rgba(0,0,0,0.3)':'rgba(255,255,255,0.7)')+'">'+c.name+'</span></div>';
        }).join('')}
      </div>

      <div style="padding:16px;">
        <h3 style="font-family:Playfair Display,Georgia,serif;font-size:12px;font-weight:700;color:var(--accent-text);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em;">Règle 60 / 30 / 10</h3>
        <div class="mb-rule-row">
          <div class="mb-rule-block" style="flex:6;background:${t.palette[0].hex};color:${isDark(t.palette[0].hex)?'#fff':'#333'}">60% ${t.rule60}</div>
          <div class="mb-rule-block" style="flex:3;background:${t.palette[1].hex};color:${isDark(t.palette[1].hex)?'#fff':'#333'}">30% ${t.rule30}</div>
          <div class="mb-rule-block" style="flex:1;background:${t.palette[3].hex};color:${isDark(t.palette[3].hex)?'#fff':'#333'}">10%</div>
        </div>
        <p style="font-size:11px;color:var(--muted);">Harmonie : <strong>${t.harmonie}</strong></p>
      </div>

      <div style="padding:0 16px 16px;">
        <h3 style="font-family:Playfair Display,Georgia,serif;font-size:12px;font-weight:700;color:var(--accent-text);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em;">Textures & Matières</h3>
        <div class="mb-texture-grid">
          ${t.textures.map(tx => '<div class="mb-texture-chip" style="background:'+tx.bg+'">'+tx.name+'</div>').join('')}
        </div>
      </div>

      <div class="mb-board-grid">
        <div class="mb-board-cell">
          <h3>Fleurs & Végétaux</h3>
          <ul>${t.fleurs.map(f => '<li>'+f+'</li>').join('')}</ul>
        </div>
        <div class="mb-board-cell">
          <h3>Éléments Signature</h3>
          <ul>${t.elements.slice(0,6).map(e => '<li>'+e+'</li>').join('')}</ul>
        </div>
      </div>

      ${t.elements.length > 6 ? '<div style="padding:12px 16px;"><div class="mb-elements-grid">'+t.elements.slice(6).map(e => '<div class="mb-el-tag">'+e+'</div>').join('')+'</div></div>' : ''}

      <div class="mb-mood-quote">&laquo; ${t.mood} &raquo;</div>

      <div class="mb-ai-section">
        <button class="mb-ai-btn" onclick="generateAiImages()">Générer les images IA pour ce thème</button>
        <div id="mbAiResult"></div>
      </div>

      <div class="mb-board-footer">Moodboard — Maison Reveal Impact</div>
    </div>
  `;

  out.scrollIntoView({behavior:'smooth', block:'start'});
}

function isDark(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*0.299 + g*0.587 + b*0.114) < 140;
}

initMoodboard();

async function generateAiImages() {
  const theme = document.getElementById('mbTheme').value;
  const bride = document.getElementById('mbBride').value || '';
  const groom = document.getElementById('mbGroom').value || '';
  const dateVal = document.getElementById('mbDate').value;
  const selectedMoods = [...document.querySelectorAll('#mbMoodChips .mb-chip.selected')].map(c => c.dataset.val);
  const selectedSeason = document.querySelector('#mbSeasonChips .mb-chip.selected');

  const btn = document.querySelector('.mb-ai-btn');
  const container = document.getElementById('mbAiResult');
  btn.disabled = true;
  btn.textContent = 'Génération en cours...';
  container.innerHTML = '<div class="mb-ai-loading"><div class="mb-ai-spinner"></div><p><strong>Connexion à l\'IA...</strong></p><p>La génération prend environ 30 secondes</p></div>';

  const steps = ['Génération de la table...', 'Génération de l\'arche...', 'Génération de l\'art floral...', 'Assemblage...'];
  let si = 0;
  const stepInterval = setInterval(() => {
    si++;
    if (si < steps.length) {
      const strong = container.querySelector('strong');
      if (strong) strong.textContent = steps[si];
    }
  }, 8000);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        theme,
        bride,
        groom,
        date: dateVal,
        mood: selectedMoods.join(', '),
        season: selectedSeason ? selectedSeason.dataset.val : ''
      })
    });
    clearInterval(stepInterval);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Erreur serveur' }));
      throw new Error(err.error || 'Erreur ' + res.status);
    }
    const data = await res.json();
    let html = '<div class="mb-ai-grid">';
    data.images.forEach(img => {
      if (!img.url) return;
      const wide = img.key === 'table' ? ' wide' : '';
      html += '<div class="mb-ai-card' + wide + '"><img src="' + img.url + '" alt="' + img.label + '" loading="lazy"><div class="caption">' + img.label + '</div></div>';
    });
    html += '</div>';
    if (data.images.every(i => !i.url)) {
      const errMsg = data.images[0]?.error || 'Aucune image générée';
      html = '<p style="color:#C62828;font-size:12px;text-align:center;padding:16px;">' + errMsg + '</p>';
    }
    container.innerHTML = html;
    btn.textContent = 'Regénérer les images IA';
    btn.disabled = false;
  } catch (err) {
    clearInterval(stepInterval);
    container.innerHTML = '<p style="color:#C62828;font-size:12px;text-align:center;padding:16px;">' + err.message + '</p>';
    btn.textContent = 'Réessayer';
    btn.disabled = false;
  }
}

/* Patch pills to handle Moodboard tab */
const origPillHandler = document.getElementById('catPills');
origPillHandler.addEventListener('click', e => {
  if (!e.target.classList.contains('cat-pill')) return;
  const cat = e.target.dataset.cat;
  const mbSection = document.getElementById('moodboardSection');
  const contentEl = document.getElementById('content');
  if (cat === 'moodboard') {
    mbSection.classList.add('visible');
    contentEl.style.display = 'none';
  } else {
    mbSection.classList.remove('visible');
    contentEl.style.display = '';
  }
}, true);
</script>
